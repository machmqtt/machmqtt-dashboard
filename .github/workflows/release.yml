name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs rehearse the whole job into a deletable draft, so this workflow
  # can be exercised without cutting a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Resolve release identity
        id: release
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >>"$GITHUB_OUTPUT"
            echo "draft=false" >>"$GITHUB_OUTPUT"
          else
            echo "tag=rehearsal-$GITHUB_RUN_ID" >>"$GITHUB_OUTPUT"
            echo "draft=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Build frontend
        run: cd ui && npm ci && npx vite build

      - name: Build binaries
        env:
          VERSION: ${{ steps.release.outputs.tag }}
        run: |
          LDFLAGS="-s -w -X main.version=${VERSION}"
          GOOS=linux   GOARCH=amd64 go build -ldflags="$LDFLAGS" -o bin/machmqtt-dashboard-linux-amd64       ./cmd/machmqtt-dashboard
          GOOS=darwin  GOARCH=amd64 go build -ldflags="$LDFLAGS" -o bin/machmqtt-dashboard-darwin-amd64      ./cmd/machmqtt-dashboard
          GOOS=darwin  GOARCH=arm64 go build -ldflags="$LDFLAGS" -o bin/machmqtt-dashboard-darwin-arm64      ./cmd/machmqtt-dashboard
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o bin/machmqtt-dashboard-windows-amd64.exe ./cmd/machmqtt-dashboard

      - name: Create release archives
        run: |
          cd bin
          tar czf machmqtt-dashboard-linux-amd64.tar.gz    machmqtt-dashboard-linux-amd64
          tar czf machmqtt-dashboard-darwin-amd64.tar.gz   machmqtt-dashboard-darwin-amd64
          tar czf machmqtt-dashboard-darwin-arm64.tar.gz   machmqtt-dashboard-darwin-arm64
          zip     machmqtt-dashboard-windows-amd64.zip      machmqtt-dashboard-windows-amd64.exe

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          draft: ${{ steps.release.outputs.draft }}
          generate_release_notes: true
          files: |
            bin/machmqtt-dashboard-linux-amd64.tar.gz
            bin/machmqtt-dashboard-darwin-amd64.tar.gz
            bin/machmqtt-dashboard-darwin-arm64.tar.gz
            bin/machmqtt-dashboard-windows-amd64.zip
