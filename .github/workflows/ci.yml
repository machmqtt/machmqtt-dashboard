name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Go format check
        run: |
          unformatted=$(gofmt -l cmd internal test/enterprise-auth/app)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: go vet ./cmd/... ./internal/... ./test/enterprise-auth/app

      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4 run

      - name: Go coverage gate
        run: make test-go-coverage

      - name: Go race suite
        run: go test -race -count=1 -timeout 600s ./cmd/... ./internal/...

      - name: Go vulnerability check
        run: |
          set -o pipefail
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./cmd/... ./internal/... ./test/enterprise-auth/app | tee govulncheck.txt

      - name: Install frontend dependencies
        run: cd ui && npm ci

      - name: NPM audit
        run: cd ui && npm audit --audit-level=moderate

      - name: ESLint
        run: cd ui && npm run lint

      - name: Frontend coverage gate
        run: cd ui && npm run test:coverage

      - name: Build frontend
        run: cd ui && npm run build

      - name: Initial bundle budget
        run: cd ui && npm run check:bundle

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-security-evidence
          path: |
            coverage.out
            ui/coverage/coverage-summary.json
            govulncheck.txt
          if-no-files-found: warn

  enterprise-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Pin npm
        run: npm install --global npm@10.9.8
      - name: Install frontend and browser
        run: |
          cd ui
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: OpenLDAP and Dex integration matrix
        run: make test-enterprise-auth

  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Pin npm
        run: npm install --global npm@10.9.8
      # The gates refuse to report success on an empty mutation set, so decide
      # applicability here rather than letting a dependency-only PR fail them.
      - name: Detect mutable changes
        id: scope
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          if git diff --quiet "$BASE" -- '*.go' ':(exclude)*_test.go'; then
            echo "go=false" >>"$GITHUB_OUTPUT"
          else
            echo "go=true" >>"$GITHUB_OUTPUT"
          fi
          if git diff --quiet "$BASE" -- 'ui/src'; then
            echo "ui=false" >>"$GITHUB_OUTPUT"
          else
            echo "ui=true" >>"$GITHUB_OUTPUT"
          fi
      - name: Go mutation gate
        if: steps.scope.outputs.go == 'true'
        env:
          GREMLINS_DIFF: origin/${{ github.base_ref }}
        run: make test-mutation-go
      - name: Frontend mutation gate
        if: steps.scope.outputs.ui == 'true'
        run: make test-mutation-ui
      - name: Retain mutation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-reports
          path: |
            mutation-reports/gremlins.json
            ui/reports/mutation/mutation.json
          if-no-files-found: warn

  release-verification:
    runs-on: ubuntu-latest
    needs: [quality-and-security, enterprise-auth]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Pin npm
        run: npm install --global npm@10.9.8
      - run: cd ui && npm ci && npm run build
      - name: Cross-compile release targets
        run: make build-all
      - name: Build release candidate once
        run: mkdir -p bin && go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_SHA}" -o bin/machmqtt-dashboard ./cmd/machmqtt-dashboard
      - name: Smoke-test release candidate
        run: bin/machmqtt-dashboard -version
      - name: Representative benchmarks
        run: scripts/benchmark-release.sh | tee benchmark.txt
      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: bin/machmqtt-dashboard
          format: spdx-json
          output-file: machmqtt-dashboard.spdx.json
          upload-artifact: false
      - name: Retain release candidate and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            bin/machmqtt-dashboard
            machmqtt-dashboard.spdx.json
            benchmark.txt
