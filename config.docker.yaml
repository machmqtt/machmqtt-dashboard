listen: ":8080"
poll_interval: 5s
# Overridden by the SESSION_SECRET env var set in docker-compose.yml. This
# placeholder is intentionally < 32 chars so the app refuses to start if no
# real secret is provided. Generate one with: openssl rand -hex 32
session_secret: "change-me"
data_dir: "/data"

environments:
  - name: local
    servers:
      - url: "http://nats-1:8222"
      - url: "http://nats-2:8222"
      - url: "http://nats-3:8222"
